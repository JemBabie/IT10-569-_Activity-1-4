<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 4 - Student Registration Form</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css" />
    <link rel="stylesheet" href="style4.css" />
</head>
<body class="body">
    <header class="bg-light py-1 shadow-sm">
        <div class="container text-center">
            <h1 class="display-6 fw-bold text-dark">Welcome to the School Club Registration</h1>
            <p class="lead text-dark">Please fill out the form below to register for your desired club.</p>
        </div>
    </header>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 col-sm-12">
            <div class="card form-card">
                <div class="card-header fs-3 form-header text-dark fw-bold">
                    School Club Registration
                </div>

                <div class="card-body p-4 text-dark">
                    
                    <form>
                        <div class="mb-3">
                            <label for="student-name" class="form-label fw-bold">
                                Full Name
                            </label>
                            <input type="text" class="form-control custom-field" id="student-name"
                                placeholder="Enter your full name" required />
                        </div>

                        <div class="mb-3">
                            <label for="student-email" class="form-label fw-bold">
                                Email Address
                            </label>
                            <input type="email" class="form-control custom-field" id="student-email"
                                placeholder="name@school.edu" required />
                        </div>

                        <div class="mb-3">
                            <label for="course-select" class="form-label fw-bold">
                                Course Selection
                            </label>
                            <select class="form-select custom-field" id="course-select" required>
                                <option value="">-- Select a course --</option>
                                <option value="cs">Computer Science</option>
                                <option value="art">Digital Art & Design</option>
                                <option value="robotics">Robotics & Engineering</option>
                                <option value="debate">Debate & Public Speaking</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="join-reason" class="form-label fw-bold">
                                Reason for Joining
                            </label>
                            <textarea class="form-control custom-field" id="join-reason" rows="4"
                                placeholder="Tell us why you would like to join this club..."></textarea>
                        </div>

                        <button type="submit" class="btn custom-btn w-100">
                            Register
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"></script>
</body>

</html>
